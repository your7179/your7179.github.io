# ── 작가SSUL(신광태 작가의 이야기 모음) Jekyll 설정 ─────────────────
# 이미 repo 루트에 _config.yml이 있다면, 아래 내용을 기존 파일에 "병합"하세요.
# (title/description 등 이름이 겹치는 항목만 덮어쓰고, 나머지는 그대로 두면 됩니다.)

title: 신광태 작가의 서재 — 작가SSUL
description: 신광태 작가가 틈틈이 남기는 짧은 글 모음
url: "https://shinbook.kr"
baseurl: ""

# 글(포스트) 주소를 /book/ssul/글제목/ 형태로 고정합니다.
# _posts 폴더는 repo 루트에 그대로 두어도, 실제 URL만 이렇게 나옵니다.
permalink: /book/ssul/:title/

# 마크다운/코드 하이라이트 엔진 (GitHub Pages 기본값과 동일)
markdown: kramdown
highlighter: rouge

# 사이트맵(sitemap.xml)과 RSS 피드(feed.xml)는 플러그인 없이
# 저장소에 직접 넣은 파일로 만듭니다. 별도 플러그인이 필요 없습니다.

# 아래 폴더/파일은 Jekyll 처리에서 제외합니다.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
