  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper-light);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    font-size:17px;
    line-height:1.8;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,h2,h3{font-family:'Noto Serif KR', serif; line-height:1.4; margin:0;}
  a{color:inherit;}
  img{max-width:100%; height:auto; display:block; margin:24px auto;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}
  .content-wrap{max-width:var(--content-max); margin:0 auto; padding:0 24px;}

  /* ---------- Top nav (메인 페이지와 완전히 동일) ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(248,245,238,0.94);
    backdrop-filter:saturate(120%) blur(6px);
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; padding-bottom:14px;
  }
  .brand{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:.01em;
    display:flex;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:var(--ink);
  }
  .brand-logo{
    height:30px;
    width:auto;
    display:block;
  }
  .topnav{display:flex; gap:22px; font-size:15px; margin-left:48px;}
  .topnav a{text-decoration:none; color:var(--ink-soft); white-space:nowrap;}
  .topnav a:hover{color:var(--brass);}
  .menu-toggle{display:none;}
  .hamburger{
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width:38px;
    height:38px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .hamburger span{
    display:block;
    width:22px;
    height:2px;
    background:var(--ink);
  }
  .mobile-nav{
    display:none;
    flex-direction:column;
    background:var(--paper-light);
    border-top:1px solid var(--line);
  }
  .mobile-nav a{
    display:block;
    padding:16px 24px;
    font-size:16.5px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .menu-toggle:checked ~ .mobile-nav{display:flex;}
  @media (max-width:640px){
    .topnav{display:none;}
    .hamburger{display:flex;}
  }

  main{padding:52px 0 80px;}
  .page-title{font-size:clamp(26px,4vw,32px); margin-bottom:10px;}
  .page-lede{color:var(--ink-soft); font-size:16.5px; margin-top:0;}

  footer{
    background:var(--shelf);
    color:#C9C1AC;
    padding:28px 0;
    font-size:13.5px;
    text-align:center;
  }
  .footer-links{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .footer-links a{
    color:#C9C1AC;
    text-decoration:none;
  }
  .footer-links a:hover{color:var(--brass-light);}
</style>
