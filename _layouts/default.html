<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}{% if page.title %} | {% endif %}신광태 작가의 서재</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F18;
    --ink-soft:#4B4438;
    --paper:#EFE9DB;
    --paper-light:#F8F5EE;
    --shelf:#1E2A22;
    --shelf-light:#2F4538;
    --brass:#A9812F;
    --brass-light:#C9A24E;
    --line:#D8CFB8;
    --max:820px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper-light);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    font-size:17px;
    line-height:1.8;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1,h2,h3{font-family:'Noto Serif KR', serif; line-height:1.4; margin:0;}
  a{color:inherit;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}

  .site-header{
    background:var(--shelf);
    color:var(--paper-light);
    padding:20px 0;
  }
  .site-header .wrap{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .site-header a.brand{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:18px;
    text-decoration:none;
    color:#FBF8F0;
  }
  .site-header nav a{
    color:var(--brass-light);
    text-decoration:none;
    font-size:14.5px;
    margin-left:18px;
  }
  .site-header nav a:hover{color:#fff;}

  main{padding:52px 0 80px;}
  .page-title{font-size:clamp(26px,4vw,32px); margin-bottom:10px;}
  .page-lede{color:var(--ink-soft); font-size:16.5px; margin-top:0;}

  footer{
    background:var(--shelf);
    color:#C9C1AC;
    padding:28px 0;
    font-size:13.5px;
    text-align:center;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="https://your7179.github.io/book/">신광태 작가의 서재</a>
    <nav>
      <a href="https://your7179.github.io/book/">Home</a>
      <a href="/book/ssul/">작가SSUL</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer>신광태 작가의 서재 · 작가SSUL</footer>

</body>
</html>
